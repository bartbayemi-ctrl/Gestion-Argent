name: Construire les installateurs (Windows / macOS / Linux)

# Se lance automatiquement à chaque push sur main, ou manuellement
# depuis l'onglet "Actions" du dépôt GitHub ("Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nom_artefact: installateur-windows
          - os: macos-latest
            nom_artefact: installateur-macos
          - os: ubuntu-latest
            nom_artefact: installateur-linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer le JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Le runner Windows de GitHub inclut normalement WiX Toolset v3.
      # Cette étape s'assure qu'il est bien présent (sécurité supplémentaire).
      - name: Vérifier WiX Toolset (Windows uniquement)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset -y
          }

      - name: Compiler le JAR complet
        run: mvn -B clean package

      - name: Générer l'installateur natif (jpackage)
        run: mvn -B jpackage:jpackage

      - name: Publier l'installateur généré
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nom_artefact }}
          path: target/installateur/*
          if-no-files-found: error

  # Rassemble les 3 installateurs et les publie sous forme de "Release"
  # GitHub, avec des noms de fichiers fixes. Contrairement aux Artifacts
  # ci-dessus (temporaires, 90 jours max), une Release donne des liens de
  # téléchargement publics et permanents, utilisables sur un site web.
  publier-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Récupérer les 3 installateurs générés
        uses: actions/download-artifact@v4
        with:
          path: artefacts

      - name: Renommer avec des noms de fichiers stables
        run: |
          mkdir -p release
          cp artefacts/installateur-windows/*.exe release/GestionArgent-Windows.exe
          cp artefacts/installateur-macos/*.dmg release/GestionArgent-macOS.dmg
          cp artefacts/installateur-linux/*.deb release/GestionArgent-Linux.deb
          ls -la release/

      - name: Publier / mettre à jour la Release "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Dernière version"
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: release/*
          fail_on_unmatched_files: true
          body: |
            Dernière version compilée automatiquement depuis la branche `main`.
            Choisissez le fichier correspondant à votre système d'exploitation.
