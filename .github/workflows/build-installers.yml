name: Construire les installateurs (Windows / macOS / Linux)

# Se lance automatiquement à chaque push sur main, ou manuellement
# depuis l'onglet "Actions" du dépôt GitHub ("Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nom_artefact: installateur-windows
          - os: macos-latest
            nom_artefact: installateur-macos
          - os: ubuntu-latest
            nom_artefact: installateur-linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer le JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Le runner Windows de GitHub inclut normalement WiX Toolset v3.
      # Cette étape s'assure qu'il est bien présent (sécurité supplémentaire).
      - name: Vérifier WiX Toolset (Windows uniquement)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset -y
          }

      - name: Compiler le JAR complet
        run: mvn -B clean package

      - name: Générer l'installateur natif (jpackage)
        run: mvn -B jpackage:jpackage

      - name: Publier l'installateur généré
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nom_artefact }}
          path: target/installateur/*
          if-no-files-found: error
